# settings for accounts.py; on the server this is /etc/sbitx-accounts/settings.ini,
# readable by the service's user only

[server]
listen = 127.0.0.1:8100
base_url = https://my.sbitx.net
database = /var/lib/sbitx-accounts/accounts.db
# open, invite or closed
registration = invite
invite_code = CHANGE-ME
# where a user is told to write when a callsign is in dispute
support = support@hfsignals.com
# zero bits of work the registration form asks of a browser; 0 turns it off
pow_bits = 18

[mail]
# with no host, mail is written to the outbox file instead of sent. With a
# host and no user, the service does not sign in: for a relay that takes
# mail from this machine's address, such as smtp-relay.gmail.com
host =
port = 587
user =
password_file = /etc/sbitx-accounts/smtp-password
sender = accounts@hfsignals.com
outbox = /var/lib/sbitx-accounts/outbox.log
