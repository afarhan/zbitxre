# what goes inside the "server" block for my.sbitx.net that listens on 443,
# in /etc/nginx/sites-available/my.sbitx.net, in place of "location /":
# every request is passed to accounts.py, which listens on this machine only

	# a browser listening to a radio: a WebSocket, handed to remote.py
	location /listen {
		proxy_pass http://127.0.0.1:8102;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_read_timeout 1h;
	}

	location / {
		proxy_pass http://127.0.0.1:8100;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 30s;
		client_max_body_size 16k;
	}
